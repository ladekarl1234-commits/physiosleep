name: Public research checks
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-and-aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install numpy==1.26.4 pyedflib==0.1.42 xlrd==2.0.2 PyYAML==6.0.3
      - run: python tools/verify_public_metrics.py
      - run: python tools/verify_exploratory_metrics.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/check_publication.py
