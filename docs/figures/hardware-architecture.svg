<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480"><rect width="1200" height="480" fill="#f4f7fa"/><g font-family="Arial,sans-serif" fill="#162b42"><text x="50" y="55" font-size="27" font-weight="bold">PhysioSleep acquisition and evidence flow</text><text x="50" y="88" font-size="17">Proposed architecture · No built or validated device</text></g><g fill="white" stroke="#458a91" stroke-width="2"><rect x="40" y="145" width="240" height="125" rx="12"/><rect x="325" y="145" width="240" height="125" rx="12"/><rect x="610" y="145" width="240" height="125" rx="12"/><rect x="895" y="145" width="265" height="125" rx="12"/></g><g font-family="Arial,sans-serif" fill="#162b42" text-anchor="middle" font-size="18"><text x="160" y="180">Declared measurements</text><text x="160" y="214">Fpz−Cz + horizontal EOG</text><text x="160" y="244" font-size="15">EOG geometry unresolved</text><text x="445" y="180">Calibrated acquisition</text><text x="445" y="214">4-channel capacity · 250 Hz</text><text x="445" y="244" font-size="15">Gain, units, clock, saturation</text><text x="730" y="180">Packets + local storage</text><text x="730" y="214">Integrity + gap accounting</text><text x="730" y="244" font-size="15">Secure container pending</text><text x="1027" y="180">Separate validation route</text><text x="1027" y="214">Conversion → offline model</text><text x="1027" y="244" font-size="15">Paired reference study required</text></g><g stroke="#458a91" stroke-width="3" fill="none"><path d="M280 208h45m-10-8 10 8-10 8M565 208h45m-10-8 10 8-10 8M850 208h45m-10-8 10 8-10 8"/></g><g font-family="Arial,sans-serif" fill="#162b42" font-size="19"><text x="50" y="335">Evidence ladder: generated fault checks → physical bench → safety review → paired recordings</text><text x="50" y="375">Contact count, channel count and model inputs are separate quantities.</text><text x="50" y="415">A rendered enclosure or calculated runtime earns no physical validation credit.</text></g></svg>
